[package]
name = "excalisidian"
version = "0.5.6"
description = "Excalisidian"
authors = ["Lucas Fidelis de Cristo"]
license = "LicenseRef-Excalisidian"
edition = "2021"

[lib]
# O sufixo `_lib` evita conflito com o nome do binário no Windows (rust-lang/cargo#8519).
name = "excalisidian_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = { version = "2", features = ["watch"] }
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
notify = "8"
notify-debouncer-full = "0.6"
tauri-plugin-http = "2.6.0"
# Cofre de credenciais do sistema para o token da conta (ADR-34). O crate genérico não traz
# loja nenhuma: a loja nativa do Windows entra só em `[target.'cfg(windows)'.dependencies]`
# abaixo, porque o app só empacota instalador para Windows (docs/05).
keyring-core = "1"

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = "1"
